name: Scheduled Quarterly Financial Report Crawler (Incremental)

on:
  # Lịch chạy tự động theo Quý
  schedule:
    # Cú pháp Cron: Chạy vào 00:00 UTC (07:00 AM giờ VN) từ ngày 8-14 các tháng 2, 5, 8, 11
    - cron: '0 0 8-14 2,5,8,11 *'
  
  # K kích hoạt thủ công từ giao diện GitHub Actions
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: 'Tích chọn nếu muốn cào lại toàn bộ lịch sử (Full Rebuild)'
        required: false
        type: boolean
        default: false

# CẤP QUYỀN GHI CHO GITHUB_TOKEN (Bắt buộc để git push thành công)
permissions:
  contents: write

jobs:
  crawl-and-convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4[cite: 5, 7]
        with:
          fetch-depth: 0 # Lấy toàn bộ lịch sử Git để tránh lỗi detached HEAD

      - name: Set up Python
        uses: actions/setup-python@v5[cite: 5, 7]
        with:
          python-version: '3.10'[cite: 5, 7]
          cache: 'pip'[cite: 5, 7]

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip[cite: 5, 7]
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi[cite: 5, 7]

      - name: Run Incremental / Full Pipeline
        env:
          FIREANT_TOKEN: ${{ secrets.FIREANT_TOKEN }}[cite: 5, 7]
        run: |
          # Kiểm tra nếu kích hoạt thủ công và full_rebuild = true
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full_rebuild }}" = "true" ]; then
            echo "🚀 Đang chạy chế độ Full Rebuild..."
            python src/run_pipeline.py --full-rebuild
          else
            echo "⚡ Đang chạy chế độ Cập nhật bổ sung (Incremental)..."
            python src/run_pipeline.py
          fi

      - name: Commit & Push updated financial data
        run: |
          git config --global user.name "github-actions[bot]"[cite: 5, 7]
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"[cite: 5, 7]
          
          # Chỉ commit và push nếu có sự thay đổi trong thư mục data/
          git add data/
          if git diff-index --quiet HEAD --; then
            echo "🟢 Không có dữ liệu mới nào thay đổi."
          else
            git commit -m "auto: Cập nhật BCTC bổ sung định kỳ"
            git push origin HEAD:${{ github.ref_name }}[cite: 5, 7]
          fi