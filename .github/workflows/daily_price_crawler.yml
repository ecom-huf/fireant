name: Daily Stock Price Crawler

on:
  schedule:
    # Chạy vào 09:00 UTC (16:00 giờ Việt Nam) từ Thứ 2 đến Thứ 6
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

jobs:
  crawl-daily-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily price crawler
        env:
          FIREANT_TOKEN: ${{ secrets.FIREANT_TOKEN }}
        run: |
          # Gọi file trong src/ và lưu đầu ra vào thư mục data/price_parquet
          python src/update_recent_5days.py --csv watchlist/Kakata.csv --output_dir data/price_parquet

      - name: Commit & Push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff-index --quiet HEAD || git commit -m "auto: Cập nhật dữ liệu giá ngày $(date +'%Y-%m-%d')"
          git push